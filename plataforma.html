<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma</title>
<!--OG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="topo"></div>
<div id="promoBox"></div>
<main id="miolo"></main>
<footer class="rodape" id="rodape"></footer>
<script src="/site.js"></script>
<script>
iniciarSite(()=>{
  const slug=slugAtual(),p=CFG.plataformas.find(x=>x.slug===slug&&x.ativo!==false);
  if(!p){$('miolo').innerHTML='<p class="vazio">Página não encontrada. <a href="/">Voltar ao início</a></p>';return}
  document.title=(p.titulo||p.nome)+' | '+CFG.loja.nome;
  const vid=yt(p.video),ben=linhas(p.beneficios),mod=linhas(p.modulos),outras=CFG.plataformas.filter(x=>x.ativo!==false&&x.slug!==slug);
  $('miolo').innerHTML=`<section class="phero" style="${p.foto?`background-image:linear-gradient(90deg,#000c,#0005),url('${esc(p.foto)}')`:`background:${esc(p.cor||'#14683f')}`}"><small>${esc(p.sub)}</small><h1>${esc(p.titulo||p.nome)}</h1><p>${esc(p.resumo)}</p><a class="cta-hero" href="#comprar" data-compra="${esc(slug)}">${esc(p.botao||CFG.curso.botao||'Quero o curso')}</a></section>
  ${vid?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="Vídeo de apresentação" allowfullscreen loading="lazy"></iframe></div>`:''}
  ${p.descricao?`<h2>Sobre ${esc(p.nome)}</h2><div class="texto">${String(p.descricao).split(/\n\s*\n/).map(t=>`<p>${esc(t.trim())}</p>`).join('')}</div>`:''}
  ${ben.length?`<h2>O que você vai aprender</h2><ul class="ck">${ben.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${mod.length?`<h2>Conteúdo</h2><ul class="mods">${mod.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  ${ofertaHTML(slug,p.botao)}
  ${outras.length?`<h2>Outras plataformas</h2><div class="pgrid">${outras.map(pcard).join('')}</div>`:''}`;
});
</script>
</body>
</html>
